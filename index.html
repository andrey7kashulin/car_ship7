<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CarShip — Автомобили</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1c1c1e;
            padding-bottom: 70px;
        }

        .header {
            background: white;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }

        .logo {
            font-family: 'Bebas Neue Cyrillic', sans-serif;
            font-size: 64px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: -5px;
            color: #2c3e50;
            transform: scaleX(0.8) scaleY(1.2);
            display: inline-block;
            flex-shrink: 0;
        }

        .road-container {
            flex: 1;
            height: 40px;
            position: relative;
            margin-left: 16px;
            opacity: 0.18;
            min-width: 60px;
        }

        .road {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 4px;
            background: repeating-linear-gradient(
                to right,
                #2c3e50 0px,
                #2c3e50 8px,
                transparent 8px,
                transparent 16px
            );
            animation: roadMove 1.5s linear infinite;
        }

        .road-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #2c3e50;
            transform: translateY(-8px);
        }

        .road-line-bottom {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #2c3e50;
            transform: translateY(8px);
        }

        @keyframes roadMove {
            0% { background-position: 0 0; }
            100% { background-position: -16px 0; }
        }

        .car-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            animation: carDrive 5s ease-in-out infinite;
            filter: brightness(1);
            opacity: 1;
        }

        @keyframes carDrive {
            0% { 
                right: -30px; 
                transform: translateY(-50%) scaleX(1); 
            }
            45% { 
                right: calc(100% - 10px); 
                transform: translateY(-50%) scaleX(1); 
            }
            50% { 
                right: calc(100% - 10px); 
                transform: translateY(-50%) scaleX(-1); 
            }
            55% { 
                right: calc(100% - 10px); 
                transform: translateY(-50%) scaleX(-1); 
            }
            95% { 
                right: -30px; 
                transform: translateY(-50%) scaleX(-1); 
            }
            100% { 
                right: -30px; 
                transform: translateY(-50%) scaleX(1); 
            }
        }

        .tabs {
            display: flex;
            background: white;
            padding: 0 16px;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid #e9ecef;
        }

        .tab {
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            color: #6c757d;
            background: none;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab.active {
            color: #0066cc;
            border-bottom: 2px solid #0066cc;
        }

        .cars-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 16px;
        }

        .car-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .car-card:active {
            transform: scale(0.97);
        }

        .car-image {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            background: #f0f0f0;
        }

        .car-info {
            padding: 12px;
        }

        .car-title {
            font-weight: 600;
            font-size: 16px;
        }

        .car-year {
            font-size: 13px;
            color: #6c757d;
            margin: 4px 0;
        }

        .car-price {
            font-weight: 700;
            font-size: 18px;
            color: #0066cc;
        }

        /* Модальное окно (детали авто) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-header {
            position: sticky;
            top: 0;
            background: white;
            padding: 16px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }

        .back-btn {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .modal-image {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: contain;
            background: #000;
        }

        .car-details {
            padding: 20px;
        }

        .car-specs {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-line;
        }

        .contact-btn {
            width: 100%;
            padding: 14px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
        }

        .stock-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-top: 12px;
        }

        .in-stock {
            background: #d4edda;
            color: #155724;
        }

        .out-of-stock {
            background: #fff3cd;
            color: #856404;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        /* Стили для слайдера */
        .slider-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            overflow: hidden;
        }

        .slider-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slider-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .slider-image.active {
            opacity: 1;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.2s;
        }

        .slider-btn:hover {
            background: rgba(0,0,0,0.8);
        }

        .slider-btn.prev {
            left: 10px;
        }

        .slider-btn.next {
            right: 10px;
        }

        .slider-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: background 0.2s;
        }

        .dot.active {
            background: white;
        }

        @media (max-width: 480px) {
            .cars-grid {
                gap: 12px;
                padding: 12px;
            }
            
            .logo {
                font-size: 48px;
            }
            
            .car-icon {
                font-size: 16px;
            }
        }
    </style>
</head>

        let currentCategory = 'china_new';
        let currentSlide = 0;

        function renderCars() {
            const container = document.getElementById('carsContainer');
            const cars = CARS_DATA[currentCategory] || [];

            if (cars.length === 0) {
                container.innerHTML = '<div class="loading">Нет автомобилей в этой категории</div>';
                return;
            }

            container.innerHTML = cars.map(car => `
                <div class="car-card" onclick="openCarModal('${currentCategory}', ${car.id})">
                    <img src="${car.photos[0] || 'https://placehold.co/400x300?text=No+Image'}" class="car-image">
                    <div class="car-info">
                        <div class="car-title">${car.brand} ${car.model}</div>
                        <div class="car-year">${car.year}</div>
                        <div class="car-price">${formatPrice(car.price)} ₽</div>
                    </div>
                </div>
            `).join('');
        }

        function openCarModal(category, carId) {
            const car = CARS_DATA[category].find(c => c.id === carId);
            if (!car) return;

            document.getElementById('modalTitle').textContent = `${car.brand} ${car.model}`;

            let photosHTML = '';

            if (car.photos.length > 1) {
                photosHTML = `
                    <div class="slider-container">
                        <div class="slider-wrapper">
                            ${car.photos.map((photo, index) => `
                                <img src="${photo}" class="slider-image ${index === 0 ? 'active' : ''}" data-index="${index}">
                            `).join('')}
                        </div>
                        <button class="slider-btn prev" onclick="changeSlide(-1)">‹</button>
                        <button class="slider-btn next" onclick="changeSlide(1)">›</button>
                        <div class="slider-dots">
                            ${car.photos.map((_, index) => `
                                <span class="dot ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></span>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                photosHTML = `<img src="${car.photos[0]}" class="modal-image">`;
            }

            document.getElementById('modalContent').innerHTML = `
                ${photosHTML}
                <div class="car-details">
                    <div style="font-size:28px; font-weight:700; color:#0066cc;">${formatPrice(car.price)} ₽</div>
                    <div class="stock-badge ${car.in_stock ? 'in-stock' : 'out-of-stock'}">
                        ${car.in_stock ? '✓ В наличии' : '📦 Под заказ'}
                    </div>
                    <div class="car-specs">
                        <strong>📋 Характеристики:</strong><br>
                        ${car.specs.replace(/\n/g, '<br>')}
                    </div>
                    <div style="margin-top:8px;">
                        <strong>📍 Местоположение:</strong> ${car.location}
                    </div>
                    <button class="contact-btn" onclick="alert('📞 Свяжитесь с нами: @CarShip_manager или +7 (XXX) XXX-XX-XX')">
                        📞 Связаться с менеджером
                    </button>
                </div>
            `;

            document.getElementById('modal').classList.add('active');
            currentSlide = 0;
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function changeSlide(direction) {
            const slides = document.querySelectorAll('.slider-image');
            const dots = document.querySelectorAll('.dot');

            if (slides.length === 0) return;

            slides[currentSlide].classList.remove('active');
            if (dots.length) dots[currentSlide].classList.remove('active');

            currentSlide += direction;

            if (currentSlide >= slides.length) currentSlide = 0;
            if (currentSlide < 0) currentSlide = slides.length - 1;

            slides[currentSlide].classList.add('active');
            if (dots.length) dots[currentSlide].classList.add('active');
        }

        function goToSlide(index) {
            const slides = document.querySelectorAll('.slider-image');
            const dots = document.querySelectorAll('.dot');

            if (slides.length === 0) return;

            slides[currentSlide].classList.remove('active');
            if (dots.length) dots[currentSlide].classList.remove('active');

            currentSlide = index;

            slides[currentSlide].classList.add('active');
            if (dots.length) dots[currentSlide].classList.add('active');
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('ru-RU').format(price);
        }

        // Переключение категорий (табы)
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                renderCars();
            });
        });

        // Подключаем Telegram WebApp (если запущено внутри Telegram)
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.enableClosingConfirmation();
        }

        // Первоначальная загрузка
        renderCars();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
